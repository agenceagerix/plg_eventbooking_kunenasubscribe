PLG_EVENTBOOKING_KUNENASUBSCRIBE="Events Booking - Abonnement Kunena"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_XML_DESCRIPTION="Abonne les inscrits d'Events Booking aux rubriques Kunena choisies sur chaque événement, pour qu'ils reçoivent les notifications du forum par mail. L'accès aux rubriques n'est pas géré ici : à combiner avec le plugin Events Booking - Joomla Groups."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_TAB="Forum Kunena"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_CATEGORIES_LABEL="Abonner les inscrits à"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_CATEGORIES_DESC="Rubriques Kunena auxquelles chaque inscrit confirmé de cet événement est abonné. Kunena vérifie toujours l'accès avant chaque notification."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_EXISTING_LABEL="Abonner aussi les inscrits actuels"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_EXISTING_DESC="À l'enregistrement, abonne aux rubriques choisies les inscrits déjà confirmés de cet événement (disposant d'un compte)."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_EXISTING_DONE="Kunena : %d inscrit(s) abonné(s)."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_NO_CATEGORY="Aucune rubrique Kunena trouvée. Créez d'abord les rubriques du forum."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_OFFLINE_LABEL="Abonner les inscrits en paiement hors ligne"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_OFFLINE_DESC="Oui : les inscrits en paiement hors ligne sont abonnés dès leur inscription. Non : à la validation de l'inscription."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_CANCEL_LABEL="Désabonner à l'annulation"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_CANCEL_DESC="Désabonne des rubriques de l'événement quand l'inscription est annulée, sauf si une autre inscription active de la même personne les utilise."
PLG_EVENTBOOKING_KUNENASUBSCRIBE_FRONTEND_LABEL="Afficher en frontend"
PLG_EVENTBOOKING_KUNENASUBSCRIBE_FRONTEND_DESC="Affiche l'onglet Kunena dans le formulaire de soumission d'événement en frontend."
